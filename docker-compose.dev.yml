services:
  nginx:
    volumes:
      - ./infrastructure/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_USE_POLLING: "true"
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-amar-assist-local-key}
    volumes:
      - ./frontend:/app
      - /app/node_modules
